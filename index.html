<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>동주 태스크 보드</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1 id="board-title">동주 태스크 보드</h1>
        <p class="sub" id="board-sub">불러오는 중…</p>
      </div>
    </header>

    <div id="setup-banner" class="banner warn" hidden></div>

    <div class="kpis">
      <div class="kpi"><div class="v" id="kpi-todo">0</div><div class="l">할 일</div></div>
      <div class="kpi"><div class="v" id="kpi-progress">0</div><div class="l">진행 중</div></div>
      <div class="kpi"><div class="v" id="kpi-done">0</div><div class="l">완료</div></div>
      <div class="kpi"><div class="v" id="kpi-not-mine">0</div><div class="l">내 업무 아님</div></div>
    </div>

    <div class="board" id="kanban">
      <section class="col" id="sec-todo" data-status="todo">
        <h2>할 일 <span class="count" id="count-todo">0</span></h2>
        <div class="list" id="list-todo" data-status="todo"></div>
      </section>

      <section class="col" id="sec-progress" data-status="in_progress">
        <h2>진행 중 <span class="count" id="count-progress">0</span></h2>
        <div class="list" id="list-progress" data-status="in_progress"></div>
      </section>

      <section class="col" id="sec-done" data-status="done">
        <h2>완료 <span class="count" id="count-done">0</span></h2>
        <div class="list" id="list-done" data-status="done"></div>
      </section>

      <section class="col" id="sec-not-mine" data-status="not_mine">
        <h2>내 업무 아님 <span class="count" id="count-not-mine">0</span></h2>
        <div class="list" id="list-not-mine" data-status="not_mine"></div>
      </section>
    </div>

    <footer class="foot">
      데이터: <code>data/tasks.json</code> + <code>data/done.json</code> (status map)
      · 카드를 열 사이로 드래그하거나 우클릭/「상태 변경」으로 이동
      · <a href="https://github.com/dongjoo-cloud/task-board" target="_blank" rel="noopener">repo</a>
    </footer>
  </div>

  <div class="status" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
