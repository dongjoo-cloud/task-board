# Persist Kanban column state to data/done.json (no user-facing PAT).
# Triggered by the Pages UI via repository_dispatch (event_type: board-status).
# Uses BOARD_WRITE_TOKEN for the push so Deploy Pages also re-runs (GITHUB_TOKEN
# pushes do not trigger further workflows).
name: Board status sync

on:
  repository_dispatch:
    types: [board-status]

permissions:
  contents: write

concurrency:
  group: board-status-done-json
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOARD_WRITE_TOKEN }}

      - name: Apply status payload and push
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Payload is the full status map, so re-applying it on top of the
          # latest main is safe. On push rejection (main moved, e.g. a
          # tasks.json screening commit or a prune), reset and re-apply instead
          # of rebasing, so other files (tasks.json / archive.json) are never
          # clobbered and archived ids stay filtered.
          for i in 1 2 3 4 5; do
            : > /tmp/status.env
            GITHUB_ENV=/tmp/status.env python3 .github/scripts/apply_status.py
            if ! grep -q '^BOARD_CHANGED=1' /tmp/status.env; then
              echo "Nothing to commit"; exit 0
            fi
            git add data/done.json
            git commit -m "chore(status): sync kanban column state"
            if git push; then exit 0; fi
            echo "push rejected, re-applying on latest main (attempt $i)"
            sleep $((i * 2))
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::could not push data/done.json after retries"
          exit 1
